name: Publish presentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload published docs
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs
      - name: Confirm uploaded artifact is available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          artifact_id = int(os.environ['ARTIFACT_ID'])
          url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?name=github-pages")
          request = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      artifacts = json.load(response)['artifacts']
                  if any(a['id'] == artifact_id and not a['expired']
                         and a['size_in_bytes'] > 0 for a in artifacts):
                      print(f'Published artifact {artifact_id} is available.')
                      break
              except urllib.error.HTTPError as error:
                  if error.code not in (404, 429, 500, 502, 503, 504):
                      raise
              except (urllib.error.URLError, TimeoutError):
                  pass
              if attempt < 19:
                  time.sleep(3)
          else:
              raise SystemExit('Uploaded github-pages artifact is not available; deployment not started.')
          PY
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          # GitHub can spend several minutes queued before syncing the files.
          # Allow the accepted deployment to finish instead of canceling at 10m.
          timeout: 1200000
