name: Publish presentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/**/*.md'
      - '!docs/*.md'
      - '.github/workflows/pages.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check publisher regressions
        run: python3 -m unittest discover -s .github/scripts -p 'test_publish_pages.py'
      - name: Stamp the publication
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          stamp = {
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'current_sha256': hashlib.sha256(Path('docs/index.html').read_bytes()).hexdigest(),
              'previous_sha256': hashlib.sha256(Path('docs/previous/index.html').read_bytes()).hexdigest(),
          }
          Path('docs/deployment.json').write_text(json.dumps(stamp) + '\n', encoding='utf-8')
          PY
      - name: Pack published docs
        run: |
          # Same single-tar, dereferenced format used by upload-pages-artifact.
          tar --dereference --hard-dereference --directory docs \
            --exclude=.git --exclude=.github --exclude='.[^/]*' \
            -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload published docs
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Confirm uploaded artifact is available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          artifact_id = int(os.environ['ARTIFACT_ID'])
          url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?name=github-pages")
          request = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      artifacts = json.load(response)['artifacts']
                  if any(a['id'] == artifact_id and not a['expired']
                         and a['size_in_bytes'] > 0 for a in artifacts):
                      print(f'Published artifact {artifact_id} is available.')
                      break
              except urllib.error.HTTPError as error:
                  if error.code not in (404, 429, 500, 502, 503, 504):
                      raise
              except (urllib.error.URLError, TimeoutError):
                  pass
              if attempt < 19:
                  time.sleep(3)
          else:
              raise SystemExit('Uploaded github-pages artifact is not available; deployment not started.')
          PY
      - name: Deploy Pages and verify public release
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
        run: python3 -u .github/scripts/publish_pages.py
