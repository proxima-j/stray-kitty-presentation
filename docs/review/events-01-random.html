<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>document.documentElement.classList.add("context-loading")</script>
<meta name="robots" content="noindex"><title>Stray Kitty — Random Events · Composition Review</title>
<link rel="stylesheet" href="review.css"><link rel="stylesheet" href="showcase-preview.css?v=context-02"></head>
<body>
<main class="review-page showcase-review events-review">
 <h1>Random Events</h1>
 <div class="review-body">
  <section class="event-sequence" aria-label="Trigger, choice and successful outcome screenshot sequence">
   <figure class="tabframe" data-tab="01 · TRIGGER">
    <div class="event-shot">
     <button class="event-media testing-media" type="button" data-full-image="../assets/pages/08/01-testing-view.png" data-image-title="Open original testing view" data-local-space aria-label="Open original testing view">
      <img src="../assets/pages/08/01-testing-view.png" alt="TESTING VIEW: the configured west trigger circle on the real Rainy Alley map">
     </button>
    </div>
   </figure>
   <div class="arrow-inline" aria-hidden="true">→</div>
   <figure class="tabframe" data-tab="02 · CHOICE CARD">
    <div class="event-shot"><button class="event-media choice-media" type="button" data-full-image="../assets/pages/08/02-event-choice.png" data-image-title="Open original choice card" data-local-space aria-label="Open original choice card">
     <img src="../assets/pages/08/02-event-choice.png" alt="屋檐下的猫粮碗: original Chinese event description and two unresolved choices">
    </button></div>
   </figure>
   <div class="arrow-inline" aria-hidden="true">→</div>
   <figure class="tabframe" data-tab="03 · RESULT CARD">
    <div class="event-shot"><button class="event-media result-media" type="button" data-full-image="../assets/pages/08/03-event-success.png" data-image-title="Open original successful result" data-local-space aria-label="Open original successful result">
     <img src="../assets/pages/08/03-event-success.png" alt="Same feeder-bowl interaction: 5 + 5 = 10, success, 鱼干 +1 and 材料 +1">
    </button></div>
   </figure>
  </section>
  <div class="event-footnotes">
   <span title="The west-zone testing view and event-card interaction are separate captures. Zone entry uses a 55% gate, subject to state and eligibility; backend 150-unit distance checks are not active across every current map.">TRIGGER ZONES + DISTANCE CHECKS</span>
   <span>CHOICE → OUTCOME</span>
  </div>
  <section class="event-closeups" aria-label="Two close-up details from the successful event result">
   <figure class="tabframe" data-tab="FOCUS 01">
    <div class="event-detail">

     <button class="event-media" type="button" data-full-image="../assets/pages/08/04-reward-fish-closeup.png" data-image-title="Open genuine Fish +1 reward crop" data-local-space aria-label="Open genuine Fish +1 reward crop"><img src="../assets/pages/08/04-reward-fish-closeup.png" alt="鱼干 +1: Fish +1 from the successful result"></button><div class="reward-copy"><strong>Fish +1</strong><small>Event reward</small></div>
    </div>
   </figure>
   <figure class="tabframe" data-tab="FOCUS 02">
    <div class="event-detail">

     <button class="event-media" type="button" data-full-image="../assets/pages/08/05-reward-material-closeup.png" data-image-title="Open genuine Material +1 reward crop" data-local-space aria-label="Open genuine Material +1 reward crop"><img src="../assets/pages/08/05-reward-material-closeup.png" alt="材料 +1: Material +1 from the same successful result"></button><div class="reward-copy"><strong>Material +1</strong><small>Event reward</small></div>
    </div>
   </figure>
  </section>
  <div class="event-conclusion">
   <span class="outcome-label primary" title="Other event outcomes can grant battle support; the two captured rewards here are resources.">Battle Support → Combat</span>
   <span class="outcome-label" title="The wider system remembers choices for later encounters; this feeder-bowl result does not itself demonstrate a later unlock.">Butterfly Effect → Future Encounters</span>
  </div>
 </div>
</main>
<script src="showcase-context.js?v=media-02"></script>
</body>
</html>
